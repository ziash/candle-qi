<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#0b1220"/>
<text x="60" y="68" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="bold">Candle Qi — Yin-to-Yang research cycle</text>
<text x="60" y="105" fill="#94a3b8" font-family="Arial" font-size="18">Conceptual states, not a deterministic market cycle</text>
<g font-family="Arial">
<rect x="55" y="165" width="245" height="300" rx="18" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<text x="85" y="215" fill="#cbd5e1" font-size="25" font-weight="bold">1 · Deep Yin</text><text x="85" y="260" fill="#e2e8f0" font-size="18">Compression</text>
<text x="85" y="300" fill="#94a3b8" font-size="16">• Narrowing ranges</text><text x="85" y="333" fill="#94a3b8" font-size="16">• Low net progress</text><text x="85" y="366" fill="#94a3b8" font-size="16">• Two-sided movement</text>
<rect x="355" y="165" width="245" height="300" rx="18" fill="#302a1e" stroke="#d6a84b" stroke-width="2"/>
<text x="385" y="215" fill="#f5d58a" font-size="25" font-weight="bold">2 · Transition</text><text x="385" y="260" fill="#e2e8f0" font-size="18">Changing behaviour</text>
<text x="385" y="300" fill="#cbd5e1" font-size="16">• DP begins to shift</text><text x="385" y="333" fill="#cbd5e1" font-size="16">• Rejection changes</text><text x="385" y="366" fill="#cbd5e1" font-size="16">• Boundary tests</text>
<rect x="655" y="165" width="245" height="300" rx="18" fill="#17352f" stroke="#34d399" stroke-width="2"/>
<text x="685" y="215" fill="#6ee7b7" font-size="25" font-weight="bold">3 · Yang</text><text x="685" y="260" fill="#e2e8f0" font-size="18">Expansion</text>
<text x="685" y="300" fill="#a7f3d0" font-size="16">• Persistent movement</text><text x="685" y="333" fill="#a7f3d0" font-size="16">• Efficient displacement</text><text x="685" y="366" fill="#a7f3d0" font-size="16">• Range break</text>
<rect x="955" y="165" width="190" height="300" rx="18" fill="#25233b" stroke="#a78bfa" stroke-width="2"/>
<text x="980" y="215" fill="#c4b5fd" font-size="25" font-weight="bold">4 · After</text><text x="980" y="260" fill="#e2e8f0" font-size="18">Evaluate</text>
<text x="980" y="300" fill="#c4b5fd" font-size="16">• Follow-through</text><text x="980" y="333" fill="#c4b5fd" font-size="16">• Failure</text><text x="980" y="366" fill="#c4b5fd" font-size="16">• Retracement</text>
</g>
<g stroke="#94a3b8" stroke-width="4" fill="none"><path d="M302 315 H345 l-12 -10 m12 10 l-12 10"/><path d="M602 315 H645 l-12 -10 m12 10 l-12 10"/><path d="M902 315 H945 l-12 -10 m12 10 l-12 10"/></g>
<text x="60" y="530" fill="#cbd5e1" font-family="Arial" font-size="19">Research target: detect behavioural change before confirmed expansion, without assuming its direction.</text>
<text x="60" y="566" fill="#64748b" font-family="Arial" font-size="15">Qi is used as a metaphor for observable price behaviour, not a physical-force claim.</text>
</svg>